services:
  - type: web
    name: athena-backend
    env: python
    plan: free
    pythonVersion: "3.13"
    buildCommand: >
      python -m pip install --upgrade pip &&
      pip install -r requirements.txt &&
      cd frontend && npm install && npm run build && cd ..
    startCommand: PYTHONPATH=./backend uvicorn backend.decoy.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health